<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance — Attendly</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="app-layout">

    <div id="sidebar-mount"></div>

    <div class="main-content">

      <header class="topbar" role="banner">
        <div class="topbar-left">
          <div class="page-title">Attendance Records</div>
          <div class="page-subtitle">Subject-wise breakdown with filters</div>
        </div>
        <div class="topbar-right">
          <div class="topbar-date" id="topbar-date"></div>
          <button class="btn-menu" id="btn-menu" aria-label="Open navigation menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="page-content" id="main" role="main">
        <!-- Entire attendance section rendered by attendance.js -->
        <div id="attendance-container"></div>
      </main>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/attendance.js"></script>
</body>
</html>
